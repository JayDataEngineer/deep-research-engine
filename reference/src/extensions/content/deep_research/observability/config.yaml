extension:
  name: observability_api
  display_name: Observability API
  description: API endpoints for run history and metrics (part of deep_research framework)
  version: 1.0.1
  author: ULLI Team
  category: feature
  tags:
    - observability
    - metrics
    - runs
    - checkpoints
    - deep_research
  type: feature
  enabled: true

dependencies:
  python_version: ">=3.10"
  pip_packages: []
  extensions: []

settings_schema: []

# =============================================================================
# DIAGNOSTIC CONFIGURATION
# =============================================================================
# Diagnostic patterns for detecting off-topic LLM responses
# These patterns help identify when the LLM is generating content unrelated
# to the original research query.

diagnostics:
  # Off-topic indicators (regex patterns)
  # These patterns commonly indicate the LLM has gone off-track
  off_topic_indicators:
    # Idioms and phrases that trigger etymology/definition responses
    - '\b(the whole nine yards|break a leg|bite the bullet|piece of cake)\b.*\b(meaning|origin|etymology)\b'
    # Programming problems (common false positive)
    - '\b(climbing stairs|fibonacci|dynamic programming|leetcode|hackerrank)\b'
    - '\bdef\s+\w+\s*\([^)]*\)\s*:'  # Python function definitions
    - '```python\s*def\s+'  # Python code blocks
    # Wikipedia-style explanations
    - '^#{1,3}\s+(history|etymology|origin|usage)\b'
    # Generic explanations that don't reference the query
    - '\b(here is|this is|the following)\s+(the|a)\s+(solution|answer|explanation)\b'

  # Domain-specific keywords for relevance checking
  # These should be configured per use-case via profiles
  domain_keywords:
    # Default gym/fitness keywords (used by soc_media_gen use case)
    default:
      - gym
      - fitness
      - workout
      - exercise
      - discipline
      - training
      - muscle
      - strength
      - health
      - motivation
      - athletic
      - lift
      - weights
      - cardio
      - bodybuilding
      - crossfit
      - physical

    # Research/academic keywords
    research:
      - research
      - study
      - analysis
      - finding
      - evidence
      - data
      - methodology
      - conclusion
      - citation
      - reference

    # News/journalism keywords
    news:
      - news
      - report
      - article
      - breaking
      - update
      - journalism
      - media
      - press

  # Minimum relevance threshold (0.0 to 1.0)
  # Below this threshold, a warning is logged
  min_relevance_threshold: 0.3

# =============================================================================
# API CONFIGURATION
# =============================================================================
api:
  # Maximum runs to return per page
  max_runs_per_page: 50

  # Default number of runs to return
  default_page_size: 20

  # Include checkpoints in run details
  include_checkpoints: true

# =============================================================================
# FILE OUTPUT CONFIGURATION
# =============================================================================
output:
  # Base directory for run logs (relative to data directory)
  base_dir: "outputs/logs/server"

  # File encoding
  encoding: "utf-8"

  # Maximum file size before rotation (in bytes)
  # 0 = no rotation
  max_file_size: 10485760  # 10 MB

  # Number of backup files to keep
  backup_count: 5
