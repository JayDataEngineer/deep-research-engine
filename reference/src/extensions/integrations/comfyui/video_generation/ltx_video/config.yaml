# =============================================================================
# Service Configuration
# =============================================================================
service:
  # ComfyUI server requirements
  server_required: true
  server_type: comfyui
  default_address: "http://127.0.0.1:18188"

  # Paths
  paths:
    workflow_file: "data/inputs/workflows/video_ltx_video.json"
    output_dir: "data/outputs/generated_videos"

  # GPU Requirements
  requirements:
    gpu_memory: "32GB+ VRAM recommended"
    disk_space: "100GB+ recommended"
    cuda_version: "12.x"

# =============================================================================
# Dependencies
# =============================================================================
dependencies:
  # ComfyUI Custom Nodes Required
  comfyui_custom_nodes:
    - description: "LTX-2 ComfyUI custom nodes from Lightricks"
      repo: "https://github.com/Lightricks/ComfyUI-LTXVideo"
      install_command: "cd backend/vendor/ComfyUI/custom_nodes && git clone https://github.com/Lightricks/ComfyUI-LTXVideo.git"
      required: true

  system:
    - description: "ComfyUI server must be running"
      check_command: "curl -s http://127.0.0.1:18188/system_stats"
    - description: "CUDA-capable GPU with 32GB+ VRAM"
      check_command: "nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits"

  python:
    - description: "requests for HTTP API communication"
      package: "requests"
    - description: "Pillow for image processing"
      package: "Pillow"
    - description: "numpy for array operations"
      package: "numpy"

# =============================================================================
# Workflow Modes
# =============================================================================
modes:
  text_to_video:
    description: "Generate video from text prompt only"
    required_models:
      - ltx_2_checkpoint
      - ltx_2_text_encoder

  image_to_video:
    description: "Generate video from text prompt and input image"
    required_models:
      - ltx_2_checkpoint
      - ltx_2_text_encoder

  video_to_video:
    description: "Transform existing video with new prompt"
    required_models:
      - ltx_2_checkpoint
      - ltx_2_text_encoder

  ic_lora_canny:
    description: "Video generation with Canny edge control"
    required_models:
      - ltx_2_checkpoint
      - ltx_2_text_encoder
      - ltx_2_ic_lora_canny

  ic_lora_depth:
    description: "Video generation with depth map control"
    required_models:
      - ltx_2_checkpoint
      - ltx_2_text_encoder
      - ltx_2_ic_lora_depth

  ic_lora_pose:
    description: "Video generation with pose control"
    required_models:
      - ltx_2_checkpoint
      - ltx_2_text_encoder
      - ltx_2_ic_lora_pose
