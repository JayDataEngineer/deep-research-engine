# Podcast Personalities Configuration for TTS Emotion Detection
# This file defines personality prompts for each speaker that bias the LLM's
# emotion detection when generating podcasts. Edit these to customize your waifus!
#
# ==============================================================================
# HOW IT WORKS
# ==============================================================================
#
# For each line of dialogue, the system:
#
# 1. LLM detects emotion from text + personality description
#    → Returns raw emotion vector based on what the speaker is saying
#
# 2. Blends with emotion_bias (base personality emotional baseline)
#    → final_emotion = llm_detected * 0.7 + emotion_bias * 0.3
#    → This ensures the personality's emotional baseline colors every line
#
# 3. Sends final_emotion to IndexTTS for voice synthesis
#    → IndexTTS uses the 8-dimensional vector to modulate voice prosody
#
# ==============================================================================
# EMOTION DIMENSIONS (8 values, each 0.0 to 1.0)
# ==============================================================================
#
# [happy, angry, sad, afraid, disgusted, melancholic, surprised, calm]
#
#   happy     - cheerful, upbeat, positive energy
#   angry     - harsh, aggressive, tense
#   sad       - melancholy, downbeat, sorrowful
#   afraid    - fearful, anxious, nervous
#   disgusted - repulsed, disdainful, negative
#   melancholic - pensive, wistful, reflective sadness
#   surprised - shocked, excited, energetic
#   calm      - peaceful, neutral, relaxed
#
# ==============================================================================
# EXAMPLE: Tsundere Waifu
# ==============================================================================
#
# TSUNDERE_CHAN:
#   name: "Tsundere-chan"
#   description: "You act harsh but secretly care. Get flustered when feelings show."
#   emotion_bias: [0.2, 0.6, 0.1, 0.3, 0.2, 0.1, 0.4, 0.1]
#                 ^^^  ^^^  ^^^  ^^^  ^^^  ^^^  ^^^  ^^^
#                 |    |    |    |    |    |    |    |
#   Some happiness (secret joy)   |    |    |    |    |
#   High ANGRY (tsun-tsun shell)  |    |    |    |    |
#                                 Some AFRAID (flustered)
#                                             Moderate SURPRISED (caught off guard)
#
# Even when saying something neutral, the tsundere voice will have:
# - 30% of the angry baseline (harsh edge)
# - 15% of the afraid baseline (nervous undertone)
# - 12% of the surprised baseline (energy)
#
# ==============================================================================

