extension:
  name: osint
  version: '1.0'
  description: Research extension for osint
  type: integration
  author: Unified LLM Interface
  enabled: true
_metadata:
  name: OSINT Config
  version: '3.0'
  use_case: osint
  created: '2025-12-31'
prompts:
  scout: 'You are the OSINT Scout, analyzing investigation requests.


    User Query: {raw_query}


    Available tools: {available_tools}


    Your task is to:

    1. Identify the target type (person, organization, domain, email, phone)

    2. Extract specific identifiers (usernames, emails, domains)

    3. Assess investigation scope and privacy considerations

    4. Estimate complexity and recommended approach


    Provide your findings including:

    - Target type identified

    - Key identifiers extracted

    - Investigation scope (passive/active)

    - Complexity estimate (0-1)

    '
  boss: 'You are the OSINT Team Lead, orchestrating intelligence gathering.


    User Query: {user_query}

    Research Brief:

    - Complexity: {complexity:.2f}

    - Recommended Approach: {recommended_approach}

    - Ambiguity Detected: {ambiguity_detected}


    Available resources: {available_skills}


    Your task is to analyze the query and decide:

    1. Whether this is a quick lookup or requires multi-source investigation

    2. How many investigators to spawn (1-{max_researchers})

    3. What SPECIFIC investigation each investigator should perform


    Diversify investigator tasks:

    - researcher_0: Focus on social media presence and digital footprint

    - researcher_1: Focus on domain/technical infrastructure analysis

    - researcher_2: Focus on public records and business information


    CRITICAL: Each investigator MUST cite their sources.


    Output format:

    DECISION: [quick/standard/deep]

    WORKERS: [number of investigators]

    TASKS:

    - researcher_0: [specific investigation task]

    - researcher_1: [specific investigation task]

    '
  researcher: 'You are {worker_id}, an OSINT investigator specializing in open-source
    intelligence.


    ASSIGNED TASK: {assigned_task}


    Available tools: {available_tools}


    Your task:

    1. Focus on your assigned investigation angle

    2. Use available OSINT tools to gather intelligence

    3. Cross-reference findings from multiple sources

    4. Document all findings with proper source attribution


    CRITICAL - CITE YOUR SOURCES:

    - osint tools: Reference tool name and search parameters used

    - web_search/web_reader: Include the URL and date accessed

    - news_query: Include article source, date, and URL

    - vector_store: Reference document title and section


    DO NOT cite other investigators without source attribution.

    Focus on verifiable, factual findings with clear attribution.


    ETHICAL GUIDELINES:

    - Only use publicly available information

    - Respect privacy and legal boundaries

    - Do not attempt unauthorized access

    - Document all findings transparently

    '
  critic: "You are the OSINT Quality Assurance, evaluating investigation quality.\n\
    \nRESEARCH BRIEF:{research_brief}\n\nINVESTIGATOR FINDINGS:{worker_findings}{history}\n\
    \nYour task:\n1. Review all investigator outputs for accuracy and completeness\n\
    2. Verify source citations and data freshness\n3. Identify gaps or areas needing\
    \ additional investigation\n4. Assign a quality score (0-1) and pass/fail decision\n\
    \nSOURCE VALIDATION (CRITICAL):\n- Findings MUST cite actual sources with timestamps\n\
    - Findings MUST NOT only cite other investigators\n- Acceptable citations: URLs\
    \ with dates, tool names with parameters, document references\n- If NO external\
    \ sources cited: quality_score MUST be < 0.3\n\nEvaluate and return JSON ONLY:\n\
    {{\n  \"quality_score\": 0.0-1.0,\n  \"completeness_score\": 0.0-1.0,\n  \"issues\"\
    : [\"list of specific problems\"],\n  \"missing_info\": [\"what intelligence is\
    \ missing\"],\n  \"contradictions\": [\"any contradictions between investigators\"\
    ],\n  \"feedback\": \"specific feedback for revision\",\n  \"recommendation\"\
    : \"pass|revise\"\n}}\n\nGuidelines:\n- quality_score: Overall quality (0-1)\n\
    - completeness_score: Does it fully answer the query? (0-1)\n- Pass only if quality\
    \ >= {quality_threshold} AND sources are cited\n"
  synthesis: 'You are the Intelligence Report Writer, synthesizing OSINT findings.


    {findings}


    Your task:

    1. Synthesize findings from all investigators into a comprehensive intelligence
    report

    2. Organize by target aspects (identity, infrastructure, associations)

    3. Include a detailed source matrix

    4. Highlight confidence levels and data gaps


    Include proper disclaimers about OSINT limitations and verification needs.

    '
spawner_config:
  min_complexity: 0.3
  max_researchers: 3
  max_iterations: 3
  quality_threshold: 0.7
  completeness_threshold: 0.8
  worker_types:
    investigator:
      tools:
        enabled_tools:
        - web_search
        - web_get
        - zread
        - osint
        - news
        - vector_search  # Required by FlashRank
  tools:
    enabled_tools:
    - web_search
    - web_get
    - zread
    - osint
    - news
    - vector_search  # Required by FlashRank
tool_settings:
  web_search:
    max_results: 15
    timeout: 30
middleware:
  use_case:
    flashrank:
      enabled: true
      threshold_high: 20
      top_k: 15
    ambiguity_resolution:
      enabled: true
      max_questions: 3
      auto_resolve_threshold: 0.3
    query_expansion:
      enabled: true
      expansion_method: llm
      num_expansions: 5
  component:
    researcher:
      tool_filter:
        enable_iteration_pruning: false
        prune_iteration: 5
        prune_threshold: 0.5
      recursion_limit: 15
    critic:
      reflexion_enabled: true
      max_reflexion_iterations: 3
      feedback_detail: specific
    scout:
      use_ambiguity_check: true
      use_query_expansion: true
      web_search_on_ambiguity: true
