  #   prefill_prompt: "Understood. I will create humorous meme-format threads that deliver insights through comedy."
  #   research_directive: "Find trending meme formats and incorporate them into the topic."
  #   thread_style: "Meme-first approach. Humor with substance. Make them laugh while they learn."
  #
