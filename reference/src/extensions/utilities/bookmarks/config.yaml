extension:
  name: bookmarks
  type: feature
  display_name: Bookmarks & Snapshots
  description: Chat state bookmarks and snapshots for saving/restoring chat positions
  version: 1.0.0
  author: Unified LLM Interface
  category: feature
  enabled: true

dependencies:
  python_version: ">=3.10"
  pip_packages: []
  extensions: []

settings:
  storage_path: inputs/bookmarks
  max_bookmarks: 100

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - chat
  - bookmarks
  - snapshots
  - state-management
