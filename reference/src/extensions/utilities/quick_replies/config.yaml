extension:
  name: quick_replies
  type: feature
  display_name: Quick Replies
  description: Quick response buttons for common phrases (SillyTavern compatible)
  version: 1.0.0
  category: feature
  enabled: true

python:
  use_host_env: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - quick-replies
  - buttons
  - shortcuts
  - ui

ui:
  sidebar_component: quick_replies
  icon: "zap"

# CLI command name
cli_command: quick_replies

# Aliases
aliases: ["quick", "replies", "qr"]
