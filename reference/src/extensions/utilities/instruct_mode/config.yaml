extension:
  name: instruct_mode
  type: feature
  display_name: Instruct Mode
  description: Instruct mode template management (SillyTavern compatible)
  version: 1.0.0
  category: feature
  enabled: true

python:
  use_host_env: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: true

tags:
  - instruct
  - templates
  - prompts
  - mode

ui:
  sidebar_component: instruct_mode
  icon: "code"

# CLI command name
cli_command: instruct

# Aliases
aliases: ["instruct", "instructmode", "im"]
