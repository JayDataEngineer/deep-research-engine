extension:
  name: expressions
  type: feature
  display_name: Expressions & Sprites
  description: Character expression images and sprite management for visual chat
  version: 1.0.0
  author: Unified LLM Interface
  category: feature
  enabled: true

dependencies:
  python_version: ">=3.10"
  pip_packages: []
  extensions: []

settings:
  storage_path: inputs/expressions
  supported_formats:
    - png
    - jpg
    - jpeg
    - gif
    - webp

capabilities:
  input_type:
    - text
    - image
  output_type:
    - text
    - image
  streaming: false

tags:
  - visual
  - sprites
  - expressions
  - characters
