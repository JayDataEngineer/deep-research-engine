extension:
  name: attachments
  type: feature
  display_name: Attachments Manager
  description: Manages file attachments and web scraping history
  version: 1.0.0
  author: Unified LLM Interface
  category: feature
  enabled: true

dependencies:
  python_version: ">=3.10"
  pip_packages: []
  extensions: []

settings:
  storage_path: inputs/attachments
  max_history: 1000

capabilities:
  input_type:
    - file
    - text
  output_type:
    - file
    - text
  streaming: false

tags:
  - attachments
  - files
  - web-scraping
