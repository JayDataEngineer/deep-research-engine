extension:
  name: providers
  type: feature
  display_name: LLM Provider Discovery
  description: Dynamic discovery of available LLM providers and models
  version: "1.0.0"
  author: "Unified LLM Interface"
  category: feature
  enabled: true
  api_prefix: /api/v1/providers

dependencies:
  python_version: ">=3.10"
  pip_packages:
    - fastapi
    - pyyaml
  extensions: []

settings:
  enabled: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - llm
  - providers
  - discovery
  - models

ui:
  provides_features:
    - provider_discovery
