extension:
  name: message_branching
  type: feature
  display_name: Message Branching
  description: |
    Manages message versioning, editing, regeneration, and deletion.
    Provides support for multiple response versions per message.
  version: 1.0.0
  category: feature
  enabled: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: true

tags:
  - messages
  - versioning
  - editing
  - branching

dependencies:
  python_version: ">=3.10"
  pip_packages: []
  extensions:
    - shared.checkpointer

# Note: The /messages/regenerate endpoint is a streaming endpoint that
# requires access to the extension graph and complex state building.
# It is left in universal.py for now as it needs significant refactoring
# to work properly as an extension.
