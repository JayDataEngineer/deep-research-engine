extension:
  name: systems
  type: feature
  display_name: System Health & Config
  description: Health checks, configuration, and system-level endpoints
  version: "1.0.0"
  author: "Unified LLM Interface"
  category: feature
  enabled: true
  api_prefix: /api/v1/system

dependencies:
  python_version: ">=3.10"
  pip_packages:
    - fastapi
    - pydantic
  extensions: []

settings:
  enabled: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - system
  - health
  - config
  - diagnostics

ui:
  provides_features:
    - system_health
