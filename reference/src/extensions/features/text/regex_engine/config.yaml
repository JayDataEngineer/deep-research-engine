extension:
  name: regex_engine
  type: feature
  display_name: Regex Engine
  description: Regex pattern management and text processing (SillyTavern compatible)
  version: 1.0.0
  category: feature
  enabled: true

python:
  use_host_env: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - regex
  - patterns
  - text-processing
  - advanced

ui:
  sidebar_component: regex_engine
  icon: "code"

# CLI command name
cli_command: regex

# Aliases
aliases: ["regex", "regexengine", "re"]
