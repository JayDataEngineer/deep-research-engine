extension:
  name: translate
  type: feature
  display_name: Translation Services
  description: Multi-language translation services using LLM
  version: 1.0.0
  author: Unified LLM Interface
  category: feature
  enabled: true

dependencies:
  python_version: ">=3.10"
  pip_packages: []
  extensions: []

settings:
  default_target_language: english

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - translation
  - multilingual
  - language
