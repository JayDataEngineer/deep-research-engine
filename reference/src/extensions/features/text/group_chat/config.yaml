extension:
  name: group_chat
  type: feature
  display_name: Group Chat
  description: Multi-character group conversations (SillyTavern compatible)
  version: 1.0.0
  category: feature
  enabled: true

python:
  use_host_env: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: true

tags:
  - chat
  - group
  - multi-character
  - roleplay

ui:
  sidebar_component: group_chat
  icon: "users"

# CLI command name
cli_command: groups

# Aliases
aliases: ["group", "gc", "groupchat"]
