extension:
  name: probability
  type: feature
  display_name: Probability Control
  description: Probability and random sampling management (SillyTavern compatible)
  version: 1.0.0
  category: feature
  enabled: true

python:
  use_host_env: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - probability
  - sampling
  - random
  - variation

ui:
  sidebar_component: probability
  icon: "shuffle"

# CLI command name
cli_command: probability

# Aliases
aliases: ["prob", "random", "sampling", "rng"]
