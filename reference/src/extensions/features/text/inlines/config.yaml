extension:
  name: inlines
  type: feature
  display_name: Inline Scripts
  description: Inline code/JavaScript execution for advanced customization (SillyTavern compatible)
  version: 1.0.0
  category: feature
  enabled: true

python:
  use_host_env: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - scripting
  - javascript
  - customization
  - advanced

ui:
  sidebar_component: inlines
  icon: "code"

# CLI command name
cli_command: inlines

# Aliases
aliases: ["inline", "scripts", "js"]
