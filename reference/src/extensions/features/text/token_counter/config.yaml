extension:
  name: token_counter
  type: feature
  display_name: Token Counter
  description: Real-time token counting and statistics (SillyTavern compatible)
  version: 1.0.0
  category: feature
  enabled: true

python:
  use_host_env: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - tokens
  - statistics
  - counting
  - budget

ui:
  sidebar_component: token_counter
  icon: "calculator"

# CLI command name
cli_command: tokens

# Aliases
aliases: ["token", "count", "tk"]
