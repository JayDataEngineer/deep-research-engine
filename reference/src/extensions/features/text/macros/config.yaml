extension:
  name: macros
  type: feature
  display_name: Macros
  description: Text shortcuts/macros for quick responses (SillyTavern compatible)
  version: 1.0.0
  category: feature
  enabled: true

python:
  use_host_env: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - macros
  - shortcuts
  - text-expansion
  - productivity

ui:
  sidebar_component: macros
  icon: "lightning"

# CLI command name
cli_command: macros

# Aliases
aliases: ["macro", "shortcut"]
