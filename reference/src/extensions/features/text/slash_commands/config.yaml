extension:
  name: slash_commands
  type: feature
  display_name: Slash Commands
  description: Comprehensive SillyTavern-compatible slash commands
  version: 1.0.0
  category: feature
  enabled: true

python:
  use_host_env: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - commands
  - slash
  - chat-control
  - shortcuts

ui:
  sidebar_component: slash_commands
  icon: "terminal"

# CLI command name
cli_command: slash

# Aliases
aliases: ["cmd", "commands"]
