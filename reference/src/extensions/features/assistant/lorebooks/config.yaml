extension:
  name: lorebooks
  type: feature
  display_name: Lorebooks
  description: World Info / Lorebook management (keyword-triggered context)
  version: 1.0.0
  category: feature
  enabled: true

python:
  use_host_env: true

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - lorebook
  - world-info
  - context
  - keywords

ui:
  sidebar_component: lorebooks
  icon: "book"

# CLI command name
cli_command: lorebooks

# Aliases
aliases: ["lore", "worldinfo", "wi"]
