extension:
  name: longterm_memory
  type: feature
  display_name: Long-Term Memory
  description: Long-term memory for storing important information across conversations (distinct from lorebooks)
  version: 1.0.0
  author: Unified LLM Interface
  category: feature
  enabled: true

dependencies:
  python_version: ">=3.10"
  pip_packages: []
  extensions: []

settings:
  storage_path: inputs/memory
  max_memories: 1000

capabilities:
  input_type:
    - text
  output_type:
    - text
  streaming: false

tags:
  - memory
  - storage
  - long-term
