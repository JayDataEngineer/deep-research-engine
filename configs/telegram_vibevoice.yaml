# Telegram Ingestion with VibeVoice ASR
# Enhanced multimodal processing with speaker diarization

workflow:
  name: telegram_vibevoice
  type: ingestion
  version: 1.0.0
  description: Telegram export processing with VibeVoice ASR diarization

input:
  type: telegram_export
  source: "${EXPORT_PATH}"

phases:
  # Phase 1: Ingestion (Parse Export + Multimodal Processing)
  - name: ingestion
    node: ingestion_node
    config:
      enabled: true
      custom:
        multimodal_enabled: true
        entity_extraction_enabled: true
        # Use VibeVoice for ASR with diarization
        asr_model: vibevoice-asr
        include_diarization: true

  # Phase 2: Drafter (Analysis and Organization)
  - name: drafter
    node: drafter_node
    config:
      worker_type: social_archive
      parallel: true
      max_concurrent: 5

      workers:
        - id: conversation_analyzer
          type: social_archive
          custom:
            task: analyze_conversation_flow
            use_diarization: true

        - id: entity_extractor
          type: social_archive
          custom:
            task: extract_people_and_topics
            include_speakers: true

        - id: timeline_builder
          type: social_archive
          custom:
            task: build_chronological_timeline
            use_timestamps: true

  # Phase 3: Critic (Quality Check)
  - name: critic
    node: critic_node
    config:
      max_retries: 2
      criteria:
        - name: transcription_quality
          weight: 0.3
          threshold: 0.7
        - name: diarization_accuracy
          weight: 0.3
          threshold: 0.7
        - name: entity_extraction
          weight: 0.4
          threshold: 0.6

  # Phase 4: Neo4j Builder (Knowledge Graph)
  - name: neo4j_builder
    node: neo4j_builder_node
    config:
      enabled: true
      custom:
        include_speaker_relationships: true
        include_temporal_edges: true

  # Phase 5: Synthesizer (Final Report)
  - name: synthesizer
    node: synthesizer_node
    config:
      format: research_report
      custom:
        include_transcript_with_speakers: true
        include_timeline: true

storage:
  postgres:
    enabled: true
    connection: "${POSTGRES_URL-postgresql://localhost:5433/telegram}"

  mongodb:
    enabled: true
    connection: "${MONGO_URL-mongodb://localhost:27017/telegram}"

  neo4j:
    enabled: true
    uri: "${NEO4J_URI-bolt://localhost:7687}"
    username: neo4j
    password: "${NEO4J_PASSWORD}"

  minio:
    enabled: true
    endpoint: "${MINIO_ENDPOINT-http://localhost:9000}"
    bucket: telegram-exports

llm:
  models:
    main: qwen-35-27
    tool: qwen-35-27-fast

tools:
  enabled:
    - vibevoice_asr
    - qwen2_5_vl
    - compreface
    - entity_extraction

execution:
  max_steps: 200
  timeout: 1800
  streaming:
    enabled: true

output:
  destination:
    type: database
  format: graph
  custom:
    include_speaker_segments: true
    include_timestamps: true
