# Social Archive Workflow
# Digest and learn from personal data dumps

workflow:
  name: social_archive
  type: ingestion
  version: 1.0.0
  description: Personal social archive digestion

input:
  type: telegram_export
  source: "${EXPORT_PATH}"

ingestion:
  enabled: true
  source: "${EXPORT_PATH}"

phases:
  - name: drafter
    config:
      workers:
        - id: social_specialist_0
          type: social_archive
          task: "Digest the social dump and learn about relationships and history."
          enabled: true
          config:
            extract_profiles: true
            map_relationships: true
            find_memories: true

  - name: critic
    config:
      max_retries: 2
      threshold: 0.6

  - name: content_clusterer
    config:
      enabled: true

  - name: neo4j_builder
    config:
      enabled: true

  - name: artifact_maker
    config:
      enabled: true

storage:
  memory:
    enabled: true
  neo4j:
    enabled: true
    uri: "bolt://neo4j.local:7687"
    username: "neo4j"
    password: "${NEO4J_PASSWORD:-testpassword}"
    namespace: "social_archive"

llm:
  models:
    main: gemma4-e4b-vision-fast
    tool: gemma4-e4b-vision-fast

output:
  destination:
    type: filesystem
    path: ./output/archive
  format: markdown
