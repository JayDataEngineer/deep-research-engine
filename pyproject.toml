[project]
name = "deep-research-engine"
version = "0.2.0"
description = "Context Engine - Minimal context building with deepagents + LangGraph Store"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "llm",
    "agent",
    "context-engine",
    "langgraph",
    "deepagents",
    "rag",
    "auto-vectorization",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# =============================================================================
# DEPENDENCIES (Latest Versions - March 2026)
# =============================================================================
dependencies = [
    "langgraph-checkpoint>=2.0.10",
    "langgraph-checkpoint-postgres>=2.0.10",
    "langchain-core>=0.3.34",
    "langchain-openai>=0.3.1",          # For LiteLLM OpenAI-compatible endpoint
    # Pydantic
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    # Config loading
    "pyyaml>=6.0.2",
    "jinja2>=3.1.5",
    # Storage backends
    "asyncpg>=0.30.0",                 # PostgreSQL
    "pgvector>=0.3.6",                 # Vector search
    # LLM providers (LiteLLM gateway only)
    "litellm>=1.59.0",                 # LiteLLM gateway
    # Logging
    "loguru>=0.7.3",                   # Modern logging
    "rich>=13.9.4",                    # CLI output
    "click>=8.1.8",                    # CLI framework
    # Observability
    "langfuse>=2.59.0",                # Langfuse tracing + prompts
    # Utilities
    "aiofiles>=24.1.0",                # Async file I/O
    "httpx>=0.28.1",                   # HTTP client
    "typing-extensions>=4.12.2",       # Type hints
    "deepagents>=0.4.11",
    "langchain>=1.2.12",
    "langgraph>=1.1.2",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "whisper-ctranslate2>=0.5.7",
    "neo4j>=6.1.0",
    "openai>=1.61.0",
    "opencv-python>=4.11.0.86",
    "streamlit>=1.55.0",
    "streamlit-extras>=0.7.8",
    "scikit-learn>=1.8.0",
    "speechbrain>=1.0.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
]

# =============================================================================
# OPTIONAL DEPENDENCIES
# =============================================================================
[project.optional-dependencies]
# Storage backends - install only what you need
postgres = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
]
mongodb = [
    "pymongo>=4.10.1",
    "motor>=3.7.0",
]
neo4j = [
    "neo4j>=5.27.0",
]
minio = [
    "boto3>=1.36.0",
    "botocore>=1.36.0",
]
all-storage = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "pymongo>=4.10.1",
    "motor>=3.7.0",
    "neo4j>=5.27.0",
    "boto3>=1.36.0",
    "botocore>=1.36.0",
]

# Ingestion converters - install only what you need
pdf = [
    "pymupdf>=1.24.0",
]
image = [
    "pillow>=10.0.0",
]
all-ingestion = [
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
]

ui = [
    "streamlit>=1.42.0",
    "streamlit-extras>=0.5.0",
]

# Development
dev = [
"pytest>=8.3.4",
"pytest-asyncio>=0.25.0",
"pytest-cov>=6.0.0",
"pytest-xdist>=3.6.1",
"pytest-mock>=3.14.0",
"vcrpy>=6.0.2",
"pytest-recording>=0.13.2",
"ruff>=0.9.2",
"mypy>=1.14.1",
"pre-commit>=4.1.0",
]

# Documentation
docs = [
"mkdocs>=1.6.1",
"mkdocs-material>=9.5.50",
"mkdocstrings[python]>=0.27.0",
"mkdocs-gen-files>=0.5.0",
]

# All-in-one
all = [
"deep-research-engine[all-storage]",
"deep-research-engine[ui]",
"deep-research-engine[dev]",
"deep-research-engine[docs]",
"anthropic>=0.45.0",
]

# =============================================================================
# SCRIPTS
# =============================================================================
[project.scripts]
deep-research = "deep_research_engine.cli.main:main"
deep-research-ui = "deep_research_engine.ui.streamlit.app:main"

# =============================================================================
# URLS
# =============================================================================
[project.urls]
Homepage = "https://github.com/your-org/deep-research-engine"
Documentation = "https://deep-research-engine.readthedocs.io"
Repository = "https://github.com/your-org/deep-research-engine"
Issues = "https://github.com/your-org/deep-research-engine/issues"
Changelog = "https://github.com/your-org/deep-research-engine/blob/main/CHANGELOG.md"

# =============================================================================
# DEPENDENCY GROUPS (UV)
# =============================================================================
[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.9.2",
    "mypy>=1.14.1",
    "pre-commit>=4.1.0",
    "ipdb>=0.13.13",
    "ipython>=8.31.0",
    "pytest-mock>=3.15.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.50",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-gen-files>=0.5.0",
]

# =============================================================================
# BUILD SYSTEM
# =============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research_engine"]

# =============================================================================
# UV CONFIGURATION
# =============================================================================
# Note: Use [project].requires-python for Python version requirement
# [tool.uv] section is for other UV-specific settings

# =============================================================================
# RUFF (Linting + Formatting)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
fix = true
unsafe-fixes = false

[tool.ruff.lint]
# Select rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
    "PERF",   # Perflint
    "PYI",    # flake8-pyi
    "D",      # pydocstyle (docstring conventions)
]

# Ignore rules
ignore = [
    "E501",   # Line length (handled by formatter)
    "ARG002", # Unused method argument (common in ABCs)
    "ARG001", # Unused function argument (common in interfaces)
    # Docstring rules - relaxed for flexibility
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
    "D102",   # Missing docstring in public method (can be added later)
    "D105",   # Missing docstring in magic method
    "D106",   # Missing docstring in public nested class
    # Style rules - can be fixed later
    "SIM108", # Use ternary operator
    "SIM102", # Use single if statement
    "RUF005", # Consider iterable unpacking
    "RUF012", # Mutable default value
    # Type annotation style - keep Union for compatibility
    "UP007",  # Use X | Y for type annotations
    # Exception handling - can be fixed later
    "B904",   # Raise with from clause
    # Hook methods in ABCs - intentional empty implementations
    "B027",   # Empty method in abstract base class
    # Whitespace - auto-fixed
    "W291",   # Trailing whitespace
    "W293",   # Blank line contains whitespace
    # Path style - can be fixed later
    "PTH123", # Use Path.open() instead of open()
]

# Docstring convention (Google style)
[tool.ruff.lint.pydocstyle]
convention = "google"

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Unused imports in __init__
"tests/**/*.py" = ["ARG", "PTH"]  # Test files

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# MYPY (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = false  # Relaxed for new context_engine
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_unimported = false
disallow_any_generics = false
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
pretty = true

# Ignore missing imports for third-party packages
[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "langfuse.*",
    "litellm.*",
    "loguru.*",
]
ignore_missing_imports = true

# =============================================================================
# PYTEST (Testing)
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "mock: marks tests as mock tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# COVERAGE
# =============================================================================
[tool.coverage.run]
source = ["src/deep_research_engine"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# =============================================================================
# PRE-COMMIT
# =============================================================================
[tool.pre-commit]
repos = [
    {repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.9.2", hooks = [{id = "ruff", args = ["--fix"]}, {id = "ruff-format"}]},
    {repo = "https://github.com/pre-commit/mirrors-mypy", rev = "v1.14.1", hooks = [{id = "mypy"}]},
]
